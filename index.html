      --grey:    #6b6b6b;

      font-weight: 600;

      color: #ddd;
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 400;
      transition: color 0.15s;
      cursor: pointer;
      background: none;
      border: none;
      white-space: nowrap;
    }

    .nav-links li a:hover,
    .nav-links li .nav-toggle:hover { color: var(--white); }

    .nav-links li a.active {
      color: var(--red);
      font-weight: 700;

    .nav-links li .dropdown {

      min-width: 180px;
      list-style: none;
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
      border-top: 2px solid var(--red);
    }

    .nav-links li:hover .dropdown { display: block; }

    .nav-links li .dropdown li a {
      display: block;
      padding: 10px 18px;
      font-size: 1.00rem;
      color: #ccc;
      border-bottom: 1px solid #2a2a2a;
    }

    .nav-links li .dropdown li a:hover {
      background: #222;
      color: var(--white);
    }

    .nav-toggle svg {
      width: 10px;
      height: 10px;
      fill: #aaa;
    }
